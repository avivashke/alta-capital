name: Deploy to Cloudflare (Worker + Static Assets & 24/7 Engine)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax & Build verification
        run: |
          node --check cloudflare/worker.js
          node --check cloudflare/db.js
          node --check cloudflare/llm.js
          node --check cloudflare/cron.js
          node --check cloudflare/market.js
          node --check functions/api/db.js
          node --check functions/api/llm.js
          node --check functions/api/market.js
          node --check functions/api/firm-cron.js
          node --check functions/api/health.js

      - name: Bundle & Dry-Run verification
        run: npx wrangler deploy --dry-run

      - name: Auto-provision Cloudflare D1 Database
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking Cloudflare D1 databases..."
          UUID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="alta-db") | .uuid' 2>/dev/null || true)
          if [ -z "$UUID" ] || [ "$UUID" = "null" ]; then
            echo "alta-db not found in account list, attempting creation..."
            CREATE_OUT=$(npx wrangler d1 create alta-db 2>&1 || true)
            echo "$CREATE_OUT"
            UUID=$(echo "$CREATE_OUT" | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -n 1)
          fi
          if [ -z "$UUID" ] || [ "$UUID" = "null" ]; then
            UUID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="alta-db") | .uuid' 2>/dev/null || true)
          fi

          if [ -n "$UUID" ] && [ "$UUID" != "null" ]; then
            echo "Successfully retrieved D1 database ID: $UUID"
            sed -i "s/database_id = .*/database_id = \"$UUID\"/" wrangler.toml
            echo "Initializing D1 schema..."
            npx wrangler d1 execute alta-db --file=cloudflare/schema.sql --yes || true
          else
            echo "D1 database ID not obtained; commenting D1 binding in wrangler.toml to complete deployment"
            sed -i '/\[\[d1_databases\]\]/,/database_id/s/^/#/' wrangler.toml
          fi

      - name: Deploy to Cloudflare Workers
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Notice if CLOUDFLARE_API_TOKEN is not yet configured in GitHub Secrets
        if: env.CF_TOKEN == ''
        run: |
          echo "::notice title=Cloudflare Deployment::Package and Edge Worker validated successfully! To automatically push live on every commit, add CLOUDFLARE_API_TOKEN in Settings -> Secrets and variables -> Actions -> New repository secret."
