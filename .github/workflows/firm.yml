name: Firm loop (24/7)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: 'How many desk cycles to run'
        default: '5'
      deep:
        description: 'Deep optimization on the first cycle'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: firm-loop
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check runner/run.mjs && node --check runner/localstorage.mjs

      - name: Run agent cycles
        env:
          GITHUB_TOKEN: ${{ secrets.FIRM_GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.OPENAI_API_KEY || secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE }}
        run: node runner/run.mjs --cycles=${{ github.event.inputs.cycles || 5 }} ${{ github.event.inputs.deep == 'true' && '--deep' || '' }}

      - name: Publish state
        run: |
          git config user.name "alta-firm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data strategies
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "chore(firm): cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
